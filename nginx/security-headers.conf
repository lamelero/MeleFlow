# ── Security headers (single source of truth) ────────────────────────
#
# nginx does NOT merge `add_header` from the server block into a location:
# as soon as a location declares any `add_header` of its own, the server-level
# set is discarded. Every location that adds headers (cache, proxy, etc.) must
# therefore include this snippet explicitly. Keep it in sync with the
# `include /etc/nginx/snippets/security-headers.conf;` lines in nginx.conf.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy, calibrated against what the app actually loads:
#   * Google Fonts stylesheets (fonts.googleapis.com) and font files
#     (fonts.gstatic.com), see frontend/index.html.
#   * api.github.com for the update checker (frontend/src/lib/updateChecker.ts).
#   * https:/data:/blob: images, for avatars, uploads and the QR code rendered
#     from api.qrserver.com (frontend/src/views/app/Profile.tsx).
#   * 'unsafe-inline' styles only (React inline style attributes and Tailwind
#     runtime values); scripts stay same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.github.com; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
