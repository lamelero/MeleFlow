# ── Rate limiting zones ──────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # ── Hide nginx version ───────────────────────────
    server_tokens off;

    # ── Disable directory listing ────────────────────
    autoindex off;

    # ── Security headers ────────────────────────────
    # Locations that add their own headers must include this snippet again
    # (nginx replaces, never merges, inherited add_header directives).
    include /etc/nginx/snippets/security-headers.conf;

    # ── Gzip ────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Frontend SPA shell ──────────────────────────
    # index.html must always be revalidated: every deploy changes the hashed
    # asset names, so a cached shell would point at files that no longer exist.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_req zone=static burst=50 nodelay;
    }

    # ── Hashed build assets (safe to cache forever) ──
    location /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_req zone=static burst=50 nodelay;
    }

    # ── PWA service worker & manifest ──────────────
    # Served from the web root and must never be cached, otherwise browsers
    # keep a stale worker/manifest and updates take up to an hour to appear.
    location = /sw.js {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        limit_req zone=static burst=20 nodelay;
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        # nginx:alpine's mime.types has no .webmanifest entry, so it falls back
        # to octet-stream and browsers refuse to treat it as a manifest.
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_req zone=static burst=20 nodelay;
    }

    # ── Backend API ─────────────────────────────────
    location /api/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── File Uploads ──────────────────────────────
    location /uploads/ {
        alias /var/www/uploads/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, max-age=3600" always;
        try_files $uri =404;
        limit_req zone=static burst=20 nodelay;
    }

    # ── WebSocket ─────────────────────────────────
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
